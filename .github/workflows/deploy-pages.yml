name: Deploy GitHub Pages

on:
  push:
    branches: [main, 'preview/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      previews: ${{ steps.preview-branches.outputs.previews }}
      preview_matrix: ${{ steps.preview-branches.outputs.preview_matrix }}
      has_previews: ${{ steps.preview-branches.outputs.has_previews }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch active preview branches
        run: git fetch --prune origin '+refs/heads/preview/*:refs/remotes/origin/preview/*'

      - name: List preview branches
        id: preview-branches
        run: node scripts/list-preview-branches.mjs >> "$GITHUB_OUTPUT"

  build-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Build and validate main Pages site
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /kostudy/
          VITE_ENABLE_AI: 'false'

      - name: Upload main build
        uses: actions/upload-artifact@v4
        with:
          name: pages-main
          path: dist
          retention-days: 1

  build-preview:
    needs: discover
    if: ${{ needs.discover.outputs.has_previews == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        preview: ${{ fromJSON(needs.discover.outputs.preview_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.preview.sha }}

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Build and validate Pages site
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ matrix.preview.basePath }}
          VITE_ENABLE_AI: 'false'

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preview.artifactName }}
          path: dist
          retention-days: 1

  assemble:
    needs: [discover, build-main, build-preview]
    if: ${{ always() && needs.discover.result == 'success' && needs.build-main.result == 'success' && (needs.build-preview.result == 'success' || needs.build-preview.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download main build
        uses: actions/download-artifact@v4
        with:
          name: pages-main
          path: main-artifact

      - name: Download preview builds
        if: ${{ needs.discover.outputs.has_previews == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: pages-preview-*
          path: preview-artifacts
          merge-multiple: false

      - name: Assemble main and preview sites
        run: node scripts/assemble-pages-site.mjs
        env:
          PAGES_SITE_DIR: dist
          PAGES_MAIN_ARTIFACT_DIR: main-artifact
          PAGES_PREVIEW_ARTIFACTS_DIR: preview-artifacts
          PAGES_PREVIEWS: ${{ needs.discover.outputs.previews }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: ${{ vars.ENABLE_PAGES_DEPLOY == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/preview/')) }}
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
